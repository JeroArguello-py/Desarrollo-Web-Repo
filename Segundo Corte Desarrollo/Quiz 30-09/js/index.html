<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universo de Personajes</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="encabezado">
        <h1>El poder esta en el CSS</h1>
        <p>Cada personaje representa un efecto visual diferente construido únicamente con CSS.</p>
    </header>

    <main class="contenedor-personajes">

        <!-- TARJETA: ARCANA -->
        <article class="tarjeta arcana">
            <div class="contenedor-imagen">
                <img src="../images/arcana.jpg" alt="Arcana">
                <span class="etiqueta-superior"> MAGIA</span>
            </div>
            <div class="contenido">
                <span class="categoria">MÍSTICO</span>
                <h2 class="nombre">Arcana</h2>
                <p class="descripcion">Un lugar magico super epico</p>
                <div class="poder-especial">
                    <span class="poder-icono">✨</span>
                    <div class="poder-info">
                        <h4>Poder especial</h4>
                        <span>Energía dimensional</span>
                    </div>
                </div>
                <button class="btn-activar">Activar poder</button>
            </div>
        </article>

    </main>

</body>
</html>
